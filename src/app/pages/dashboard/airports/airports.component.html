<ui-navbar></ui-navbar>

<h2 class="text-2xl font-bold mb-4">Liste des aéroports</h2>

<h3 class="text-lg font-semibold mb-2">Créer un aéroport</h3>

<form [formGroup]="airportForm" (ngSubmit)="onSubmit()" class="mb-6 flex flex-wrap gap-3 items-end bg-muted p-4 rounded shadow">
  <input class="border px-3 py-2 rounded focus:outline-none focus:ring w-40" formControlName="name" placeholder="Nom" required />
  <input class="border px-3 py-2 rounded focus:outline-none focus:ring w-24 uppercase" formControlName="iata" placeholder="IATA" maxlength="3" required />
  <input class="border px-3 py-2 rounded focus:outline-none focus:ring w-40" formControlName="city" placeholder="Ville" required />
  <input class="border px-3 py-2 rounded focus:outline-none focus:ring w-40" formControlName="country" placeholder="Pays" required />
  <button hlmBtn type="submit" variant="default" size="sm">Créer</button>
</form>

<button hlmBtn (click)="refresh()" class="mb-4">Rafraîchir</button>

<div *ngIf="airports?.length; else noData">
  <div class="overflow-x-auto rounded shadow">
    <table class="table-auto w-full border bg-white">
      <thead class="bg-muted">
        <tr>
          <th class="border px-3 py-2">ID</th>
          <th class="border px-3 py-2">Nom</th>
          <th class="border px-3 py-2">IATA</th>
          <th class="border px-3 py-2">Ville</th>
          <th class="border px-3 py-2">Pays</th>
          <th class="border px-3 py-2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let airport of airports" class="hover:bg-muted/50 transition">
          <td class="border px-3 py-2">{{ airport.id_airport }}</td>
          <td class="border px-3 py-2">{{ airport.name }}</td>
          <td class="border px-3 py-2 font-mono uppercase">{{ airport.iata }}</td>
          <td class="border px-3 py-2">{{ airport.city }}</td>
          <td class="border px-3 py-2">{{ airport.country }}</td>
          <td class="border px-3 py-2 flex gap-2">
            <button hlmBtn variant="outline" size="sm" (click)="edit(airport)">Modifier</button>
            <button hlmBtn variant="destructive" size="sm" (click)="delete(airport)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<ng-template #noData>
  <p class="text-center text-muted-foreground mt-8">Aucun aéroport trouvé.</p>
</ng-template>
