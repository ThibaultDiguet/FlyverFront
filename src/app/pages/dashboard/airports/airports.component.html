<ui-navbar></ui-navbar>

<div class="max-w-5xl mx-auto mt-8 px-4">
  <h2 class="text-3xl font-extrabold mb-6 flex items-center gap-2">
    <span class="inline-block bg-blue-100 text-blue-700 rounded-full p-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.5 19.5l19-7-19-7v6l15 1-15 1v6z" /></svg>
    </span>
    Liste des aéroports
  </h2>

  <div class="bg-white rounded-lg shadow-md p-6 mb-8 border border-border">
    <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
      <span class="inline-block bg-green-100 text-green-700 rounded-full p-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
      </span>
      Créer un aéroport
    </h3>
    <form [formGroup]="airportForm" (ngSubmit)="onSubmit()" class="flex flex-wrap gap-4 items-end">
      <div class="flex flex-col w-full sm:w-1/4">
        <label class="mb-1 font-medium text-sm text-muted-foreground">Nom</label>
        <input class="border px-3 py-2 rounded focus:outline-none focus:ring w-full" formControlName="name" placeholder="Nom" required />
      </div>
      <div class="flex flex-col w-full sm:w-1/6">
        <label class="mb-1 font-medium text-sm text-muted-foreground">IATA</label>
        <input class="border px-3 py-2 rounded focus:outline-none focus:ring w-full uppercase" formControlName="iata" placeholder="IATA" maxlength="3" required />
      </div>
      <div class="flex flex-col w-full sm:w-1/4">
        <label class="mb-1 font-medium text-sm text-muted-foreground">Ville</label>
        <input class="border px-3 py-2 rounded focus:outline-none focus:ring w-full" formControlName="city" placeholder="Ville" required />
      </div>
      <div class="flex flex-col w-full sm:w-1/4">
        <label class="mb-1 font-medium text-sm text-muted-foreground">Pays</label>
        <input class="border px-3 py-2 rounded focus:outline-none focus:ring w-full" formControlName="country" placeholder="Pays" required />
      </div>
      <div class="flex flex-col w-full sm:w-auto">
        <button hlmBtn type="submit" variant="default" size="sm" class="w-full sm:w-auto mt-4 sm:mt-0">Créer</button>
      </div>
    </form>
  </div>

  <div class="flex justify-between items-center mb-4">
    <span class="text-muted-foreground text-sm">{{ airports.length || 0 }} aéroport(s)</span>
    <button hlmBtn (click)="refresh()" variant="outline" size="sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582M20 20v-5h-.581M5 19A9 9 0 0021 12.5M19 5A9 9 0 003 11.5" /></svg>
      Rafraîchir
    </button>
  </div>

  <div *ngIf="airports?.length; else noData">
    <div class="overflow-x-auto rounded shadow border border-border bg-white">
      <table class="table-auto w-full">
        <thead class="bg-muted">
          <tr>
            <th class="border px-3 py-2">ID</th>
            <th class="border px-3 py-2">Nom</th>
            <th class="border px-3 py-2">IATA</th>
            <th class="border px-3 py-2">Ville</th>
            <th class="border px-3 py-2">Pays</th>
            <th class="border px-3 py-2">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let airport of airports" class="hover:bg-blue-50 transition">
            <td class="border px-3 py-2 font-mono text-xs text-muted-foreground">{{ airport.id_airport }}</td>
            <td class="border px-3 py-2">{{ airport.name }}</td>
            <td class="border px-3 py-2 font-mono uppercase">{{ airport.iata }}</td>
            <td class="border px-3 py-2">{{ airport.city }}</td>
            <td class="border px-3 py-2">{{ airport.country }}</td>
            <td class="border px-3 py-2 flex gap-2">
              <button hlmBtn variant="outline" size="sm" (click)="edit(airport)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 13l6-6m2 2l-6 6m-2 2h6" /></svg>
                Modifier
              </button>
              <button hlmBtn variant="destructive" size="sm" (click)="delete(airport)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <ng-template #noData>
    <div class="text-center text-muted-foreground mt-8">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-2 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 21m5.25-4l.75 4m-7.5-8.5A7.5 7.5 0 1121 12.5 7.5 7.5 0 013.75 12.5z" /></svg>
      Aucun aéroport trouvé.
    </div>
  </ng-template>
</div>
