<ui-navbar></ui-navbar>

<section class="w-full mx-auto p-5 max-w-md">
  <h2 class="font-semibold text-2xl text-zinc-800">Inscription</h2>
  <p class="text-sm font-light text-zinc-600 mb-4">Remplissez le formulaire pour créer votre compte Flyver.</p>
  <form [formGroup]="registerForm" (ngSubmit)="submitForm()">
    <div class="mb-5">
      <label for="name" class="block mb-2 text-sm font-medium text-zinc-800">Nom</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="bg-gray-50 border border-gray-300 text-zinc-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5"
        required
        [ngClass]="{'border-red-500': isFieldInvalid('name')}"
      />
      <small *ngIf="isFieldInvalid('name')" class="text-red-500 text-sm font-medium">Nom requis.</small>
    </div>
    <div class="mb-5">
      <label for="first_name" class="block mb-2 text-sm font-medium text-zinc-800">Prénom</label>
      <input
        type="text"
        id="first_name"
        formControlName="first_name"
        class="bg-gray-50 border border-gray-300 text-zinc-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5"
        required
        [ngClass]="{'border-red-500': isFieldInvalid('first_name')}"
      />
      <small *ngIf="isFieldInvalid('first_name')" class="text-red-500 text-sm font-medium">Prénom requis.</small>
    </div>
    <div class="mb-5">
      <label for="email" class="block mb-2 text-sm font-medium text-zinc-800">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="bg-gray-50 border border-gray-300 text-zinc-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5"
        required
        [ngClass]="{'border-red-500': isFieldInvalid('email')}"
      />
      <small *ngIf="isFieldInvalid('email')" class="text-red-500 text-sm font-medium">Email valide requis.</small>
    </div>
    <div class="mb-5">
      <label for="password" class="block mb-2 text-sm font-medium text-zinc-800">Mot de passe</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="bg-gray-50 border border-gray-300 text-zinc-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5"
        required
        [ngClass]="{'border-red-500': isFieldInvalid('password')}"
      />
      <small *ngIf="isFieldInvalid('password')" class="text-red-500 text-sm font-medium">Mot de passe (min 6 caractères).</small>
    </div>
    <button
      type="submit"
      [disabled]="isLoading || registerForm.invalid"
      class="disabled:bg-indigo-700/50 w-full text-white bg-indigo-700 hover:bg-indigo-800 focus:ring-4 focus:outline-none focus:ring-indigo-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
    >
      <svg *ngIf="isLoading" aria-hidden="true" role="status" class="inline w-4 h-4 me-3 text-white animate-spin" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="#E5E7EB"/>
        <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.864 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7994 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentColor"/>
      </svg>
      {{ isLoading ? 'Inscription...' : "S'inscrire" }}
    </button>
    <div *ngIf="errorMsg" class="text-red-600 mt-2 text-center">{{ errorMsg }}</div>
    <div *ngIf="successMsg" class="text-green-600 mt-2 text-center">{{ successMsg }}</div>
  </form>
</section>

  <div class="mt-4 text-center">
    <span class="text-sm text-zinc-700">Déjà un compte ?</span>
    <a routerLink="/login" class="text-indigo-700 hover:underline font-medium ml-1">Se connecter</a>
  </div>
