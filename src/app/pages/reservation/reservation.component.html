<ui-navbar></ui-navbar>

<div class="max-w-3xl mx-auto mt-8 px-4">
  <h2 class="text-3xl font-extrabold mb-6 flex items-center gap-2">
    <span class="inline-block bg-blue-100 text-blue-700 rounded-full p-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.5 19.5l19-7-19-7v6l15 1-15 1v6z" />
      </svg>
    </span>
    Réserver un vol
  </h2>

  <div class="bg-white rounded-lg shadow-md p-6 mb-8 border border-border">
    <form [formGroup]="reservationForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
          <label class="block mb-1 font-medium text-sm text-muted-foreground">Vol</label>
          <select class="border px-3 py-2 rounded w-full" formControlName="flight_id" required>
            <option value="" disabled selected>Choisir un vol</option>
            <option *ngFor="let flight of flights" [value]="flight.id_flight">
              Vol #{{ flight.id_flight }} - Avion {{ flight.plane_id }} ({{ flight.departure_airport_id }} → {{ flight.arrival_airport_id }})
            </option>
          </select>
        </div>
        <div>
          <label class="block mb-1 font-medium text-sm text-muted-foreground">Nombre de passagers</label>
          <input type="number" min="1" class="border px-3 py-2 rounded w-full" formControlName="nb_passengers" (change)="onNbPassengersChange()" required>
        </div>
      </div>

      <div formArrayName="passengers">
        <div *ngFor="let passenger of passengers.controls; let i = index" [formGroupName]="i" class="border rounded p-4 mb-6 bg-muted/50">
          <h4 class="font-semibold mb-4 flex items-center gap-2">
            <span class="inline-block bg-green-100 text-green-700 rounded-full p-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
            </span>
            Passager {{ i + 1 }}
          </h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block mb-1 text-sm text-muted-foreground">Prénom</label>
              <input class="border px-3 py-2 rounded w-full" formControlName="first_name" required>
            </div>
            <div>
              <label class="block mb-1 text-sm text-muted-foreground">Nom</label>
              <input class="border px-3 py-2 rounded w-full" formControlName="last_name" required>
            </div>
            <div>
              <label class="block mb-1 text-sm text-muted-foreground">Date de naissance</label>
              <input class="border px-3 py-2 rounded w-full" type="date" formControlName="birth_date" required>
            </div>
            <div>
              <label class="block mb-1 text-sm text-muted-foreground">Nationalité</label>
              <input class="border px-3 py-2 rounded w-full" formControlName="nationality" required>
            </div>
          </div>
        </div>
      </div>

      <button hlmBtn type="submit" variant="default" size="lg" [disabled]="submitting || reservationForm.invalid" class="w-full">
        Réserver
      </button>
      <div *ngIf="successMsg" class="text-green-600 mt-2 text-center">{{ successMsg }}</div>
      <div *ngIf="errorMsg" class="text-red-600 mt-2 text-center">{{ errorMsg }}</div>
    </form>
  </div>
</div>
